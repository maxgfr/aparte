version: 2
updates:
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Pyodide 314 ships its runtime as pyodide.asm.mjs only, while the sandbox's classic worker loads pyodide.asm.js
      # through importScripts (src/sandbox/frame/py-worker.ts). Moving to it is a reviewed change of the sandbox loader
      # and of runtime-lock.json; 0.29.x patches still come in.
      - dependency-name: pyodide
        versions: ['>=1.0.0']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # The RustCrypto crates share the digest and cipher traits and must move together, majors included.
      rustcrypto:
        patterns:
          - sha2
          - hmac
          - hkdf
          - digest
          - crypto-common
          - block-buffer
          - cipher
          - aead
          - chacha20
          - chacha20poly1305
          - poly1305
          - aes-gcm
          - argon2
          - password-hash
          - universal-hash
        update-types: [major, minor, patch]
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
