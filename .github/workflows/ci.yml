name: CI
# The gates every change must pass: web checks, end-to-end tests in three engines, the Rust workspace,
# secret scanning over the whole history, and workflow lints. Release runs it again on main before publishing.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && github.ref != 'refs/heads/main' }}
env:
  BUN_VERSION: 1.4.3
  RUST_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: always
  ACTIONLINT_VERSION: v1.7.12
  GITLEAKS_VERSION: 8.30.1
  # The SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz; change it with GITLEAKS_VERSION.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
jobs:
  web-check:
    name: Web (typecheck, lint, unit, build, scan, size)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check

  web-e2e:
    name: Web end-to-end (Chromium, Firefox, WebKit, axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      # Firefox runs Web Audio only through a sound server, and the runner has none: a PulseAudio null sink on a
      # private socket stands in, so dictation records the specs' stand-in microphone as on a real machine. The
      # Playwright config hands E2E_PULSE_SERVER to Firefox only (Chromium's headless audio stalls on PulseAudio).
      - name: Start a sound server
        env:
          E2E_PULSE_SERVER: unix:/tmp/aparte-e2e-pulse/native
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pulseaudio
          socket="${E2E_PULSE_SERVER#unix:}"
          mkdir -p "${socket%/*}"
          pulseaudio --daemonize=yes --exit-idle-time=-1 -n \
            --load="module-native-protocol-unix socket=$socket auth-anonymous=1" \
            --load="module-null-sink sink_name=e2e"
          PULSE_SERVER="$E2E_PULSE_SERVER" pactl info
      # The suite runs against the production build, CSP and service worker included.
      - run: bun run build
      - run: bun run test:e2e
        env:
          E2E_PULSE_SERVER: unix:/tmp/aparte-e2e-pulse/native
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  rust:
    name: Rust (fmt, clippy, tests, deny, actionlint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests read the cache that main writes but never write one main could read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,shellcheck@0.11.0
      # install-action has no actionlint manifest at this pin; the Go module proxy checksums it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
      # CI=true (set by the runner) makes check.sh fail instead of skipping a stage whose tool is missing.
      - run: scripts/check.sh

  secrets:
    name: Secrets (gitleaks over the full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "$url"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: gitleaks git --redact --verbose --exit-code 1 .

  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: zizmor@1.30.1,shellcheck@0.11.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
      # actionlint runs shellcheck over every run: block when shellcheck is on PATH.
      - run: actionlint
      # Offline: the audits that query GitHub (known vulnerable actions, impostor commits) need a token.
      - run: zizmor --offline --format=github .

  vectors:
    name: Vectors (TypeScript reference vs Rust, byte for byte)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check-vectors.sh
