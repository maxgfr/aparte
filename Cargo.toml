[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The release workflow stamps this line (scripts/cli-version.sh) before building; main keeps the last release.
version = "1.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/maxgfr/aparte"
homepage = "https://maxgfr.github.io/aparte/"
authors = ["Maxime (maxgfr)"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
aparte-format = { path = "crates/aparte-format" }
aparte-crypto = { path = "crates/aparte-crypto" }
aparte-llm = { path = "crates/aparte-llm" }
aparte-agent = { path = "crates/aparte-agent" }
aparte-tools = { path = "crates/aparte-tools" }
aparte-tui = { path = "crates/aparte-tui" }

# Every external crate opts out of default features; each crate turns on what it uses.
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "env",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
clap_complete = { version = "4.6.11", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std", "raw_value"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false }

# Cryptography and the aparte/1 encodings: pure Rust only (deny.toml bans OpenSSL).
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = { version = "0.4.3", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }
unicode-normalization = { version = "0.1.26", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

# The agent: async runtime, HTTP with rustls over ring (no OpenSSL, no aws-lc), tool schemas.
tokio = { version = "1.53.3", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "alloc"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive"] }

# Developer tools: ripgrep's walker and searcher, diffs.
ignore = { version = "0.4.33", default-features = false }
globset = { version = "0.4.20", default-features = false }
grep-regex = { version = "0.1.14", default-features = false }
grep-searcher = { version = "0.1.17", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
similar = { version = "3.2.0", default-features = false, features = ["text"] }

# Terminal interface: inline viewport, input, Markdown and highlighting (pure-Rust regex engine).
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "scrolling-regions"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "event-stream"] }
ratatui-textarea = { version = "0.9.3", default-features = false, features = ["crossterm"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
unicode-width = { version = "0.2.2", default-features = false }

# Tests
tempfile = { version = "3.27.0", default-features = false }
assert_cmd = { version = "2.2.2", default-features = false }
predicates = { version = "3.1.4", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
