# gitleaks configuration: the default rules, plus allowlists for published test material.
[extend]
useDefault = true

# The keys, IVs and ciphertexts under spec/kat and spec/vectors are fixed, public test inputs (RFC and Wycheproof known
# answers, and the aparte/1 cross-implementation vectors); they protect nothing and must stay byte-exact.
[[allowlists]]
description = "Public cryptographic test vectors"
paths = [
  '''(^|/)spec/kat/[^/]+\.json$''',
  '''(^|/)spec/vectors/[^/]+\.json$''',
]

# Unit and end-to-end tests use made-up API keys with an `sk-test-` or `sk-secret-` prefix. Both conditions must hold:
# a real key in a test file, or a fake-looking key anywhere else, is still reported.
[[allowlists]]
description = "Made-up API keys in tests"
condition = "AND"
paths = ['''(^|/)web/(src|e2e)/.+\.(test|spec)\.ts$''']
regexes = ['''^sk-(test|secret)-[a-z0-9-]+$''']
