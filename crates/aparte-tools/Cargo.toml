[package]
name = "aparte-tools"
description = "Developer tools for the aparte agent: read, write, edit, bash (sandboxed), grep, find, ls, git, web fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
aparte-agent = { workspace = true }
aparte-llm = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true, features = ["std"] }
globset = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "macros", "fs"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
